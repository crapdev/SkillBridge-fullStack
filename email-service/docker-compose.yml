# Herramientas locales del email-service. RabbitMQ NO se levanta aquí: se usa el broker principal de SkillBridge
# (docker compose up -d rabbitmq desde la raíz del repositorio), que es el mismo al que publica el backend Java.
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: skillbridge-email-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
