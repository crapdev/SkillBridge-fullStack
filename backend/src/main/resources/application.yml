server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: skillbridge-api
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          # Modelos oficiales de DeepSeek: 'deepseek-chat' (V3) o 'deepseek-reasoner' (R1).
          # Puedes sobreescribirlo con DEEPSEEK_MODEL si usas un proveedor/gateway específico como OpenRouter o Groq.
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.2
          max-tokens: 800

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skillbridge}
    username: ${DATABASE_USER:skillbridge}
    password: ${DATABASE_PASSWORD:skillbridge_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      properties:
        hibernate:
          jdbc:
            time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Propiedades que busca JwtService
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 horas en milisegundos

app:
  jwt:
    # Clave Base64 de al menos 256 bits; en producción se inyecta con JWT_SECRET
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: ${JWT_EXPIRATION:86400000} # 24 horas
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8088,http://localhost:4200}
  cache:
    offerings-ttl-minutes: ${OFFERINGS_CACHE_TTL_MINUTES:10}
