# Pipeline de datos de SkillBridge: PySpark en modo local, pruebas con pytest.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skillbridge-data"
version = "0.1.0"
description = "Pipeline PySpark y pruebas de calidad de datos de SkillBridge"
requires-python = ">=3.10,<3.14"   # PySpark 4.0 soporta Python 3.9-3.13
dependencies = [
  "pyspark==4.0.1",                 # requiere Java 17 o 21
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "faker>=37,<38",                  # datos sintéticos (generate.py)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]                # permite correr pytest sin instalar el paquete
addopts = "-ra"
markers = [
  "quality: pruebas de calidad de datos (Anexo A)",
  "reconciliation: conciliación origen-destino",
  "slow: pruebas con conjuntos grandes",
]
