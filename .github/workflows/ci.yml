# CI de SkillBridge: GitHub Actions ejecuta estos jobs en máquinas Linux limpias.
name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']   # al subir commits a estas ramas
  pull_request:
    branches: [main, develop]                            # PRs cuyo destino es main o develop

permissions:
  contents: read   # solo lectura del repositorio (seguridad)

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # los comandos corren dentro de backend/
    steps:
      - name: Checkout
        uses: actions/checkout@v4    # descarga el código

      - name: Setup Java 21
        uses: actions/setup-java@v4  # instala Java 21 y cachea Maven
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unused imports (Checkstyle)
        run: mvn -B checkstyle:check                          # falla si hay imports sin usar

      - name: Architecture rules (hexagonal)
        run: mvn -B test -Dtest=HexagonalArchitectureTest     # solo las reglas de arquitectura

      # Los tests de persistencia (Testcontainers) necesitan la imagen de PostgreSQL. Docker Hub limita
      # las descargas anónimas desde GitHub Actions y a veces no responde, lo que hacía fallar el CI.
      # Se descarga antes desde el espejo de Google (sin ese límite) con reintentos; Testcontainers
      # reutiliza la imagen local y ya no la pide a Docker Hub.
      - name: Pre-pull PostgreSQL image for Testcontainers
        run: |
          for attempt in 1 2 3; do
            docker pull mirror.gcr.io/library/postgres:17-alpine \
              && docker tag mirror.gcr.io/library/postgres:17-alpine postgres:17-alpine \
              && exit 0
            echo "Intento $attempt fallido; reintentando en 10 s..."
            sleep 10
          done
          docker pull postgres:17-alpine                       # último recurso: Docker Hub

      - name: Test and package
        run: mvn -B clean verify                              # compila, corre todos los tests y empaqueta

  
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend  # los comandos corren dentro de frontend/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci --no-audit --no-fund                      # instala versiones exactas de package-lock.json

      - name: Type check (unused imports)
        run: npx tsc -p tsconfig.app.json --noEmit            # falla si hay imports sin usar

      - name: Build
        run: npm run build                                    # compila Angular para producción

        
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]    # solo corre si backend y frontend pasaron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image    # verifica que la imagen se construya (no se publica)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: skillbridge-api:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: skillbridge-web:ci
